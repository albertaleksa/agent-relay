services:
  agent-relay:
    build: .
    image: agent-relay:local
    # The hosted Docker daemon used by this workspace blocks traffic between
    # bridge peers. Sharing postgres's network namespace keeps service-name
    # addressing (`postgres:5432`) and still runs each process separately.
    network_mode: service:postgres
    environment:
      RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@postgres:5432/agent_relay
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: agent_relay
      POSTGRES_USER: agent_relay
      POSTGRES_PASSWORD: agent_relay
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_relay -d agent_relay"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
